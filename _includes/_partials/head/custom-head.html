Custom head.
{% endcomment %}

{% comment %} GPX map blocks — renders ```gpx fences via assets/js/gpx-map.js {% endcomment %}
<style>
  /* Hide the raw config block until the script swaps it for a map. */
  .language-gpx { display: none; }

  .gpx-figure { margin: 1.5em 0; }

  .gpx-map {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 4px;
    background: #f7f7f7;
  }
  /* keep Leaflet panes under the theme's sticky header */
  .gpx-map .leaflet-pane,
  .gpx-map .leaflet-control { z-index: 1; }

  .gpx-caption {
    margin-top: .6em;
    font-size: .9em;
    color: #999;
    text-align: center;
  }
  .gpx-caption.gpx-error { color: #c0392b; }

  .gpx-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 14px;
  }
  .gpx-gallery figure { margin: 0; }
  .gpx-gallery img {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 2;
    object-fit: cover;
    border-radius: 4px;
  }
  .gpx-gallery figcaption {
    margin-top: .35em;
    font-size: .82em;
    color: #999;
    text-align: center;
  }
</style>
{% comment %} Without JS, show the block's contents instead of an empty gap. {% endcomment %}
<noscript><style>.language-gpx { display: block; }</style></noscript>
<script defer src="{{ '/assets/js/gpx-map.js' | relative_url }}"></script>
